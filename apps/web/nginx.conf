server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback — any non-/api route serves index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Static assets get long cache TTL (Vite emits hashed filenames).
  location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
    expires 1y;
    access_log off;
    add_header Cache-Control "public, immutable";
  }

  # Reverse-proxy API calls to the Express service. Honors session cookie.
  # `^~` prevents the static-asset regex location below from matching first
  # if any /api URL ever contains a known extension (e.g. /api/foo.svg).
  location ^~ /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Bull-board queue dashboard, served by the api at /admin/queues. Same
  # cookie auth as /api so an existing session is honored.
  # `^~` makes this prefix location win over the regex `location ~* \.(css|js|...)`
  # below — without it, bull-board's hashed asset URLs match the SPA-static
  # regex first and 404 against the nginx html root.
  location ^~ /admin/queues {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
