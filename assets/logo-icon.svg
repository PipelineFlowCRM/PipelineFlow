<svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="PipelineFlow icon">
  <defs>
    <linearGradient id="pf-bg" x1="0" y1="0" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="55%" stop-color="#0891B2"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <filter id="pf-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.6"/>
      <feOffset dx="0" dy="0.6" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect width="80" height="80" rx="18" fill="url(#pf-bg)"/>

  <!-- Pipeline stage bars (ascending) -->
  <g filter="url(#pf-shadow)">
    <rect x="16" y="48" width="12" height="20" rx="3" fill="#FFFFFF" fill-opacity="0.72"/>
    <rect x="34" y="38" width="12" height="30" rx="3" fill="#FFFFFF" fill-opacity="0.86"/>
    <rect x="52" y="24" width="12" height="44" rx="3" fill="#FFFFFF"/>
  </g>

  <!-- Flow curve arching over the bars -->
  <path d="M22 42 Q40 16 58 14" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none"/>
  <circle cx="22" cy="42" r="2.6" fill="#FFFFFF"/>
  <circle cx="58" cy="14" r="3.2" fill="#FFFFFF"/>
</svg>
